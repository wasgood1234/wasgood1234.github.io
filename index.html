<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角比テスト（象限選択式）</title>
<style>
  body { font-family: system-ui; background:#f5f5f5; padding:20px; }
  .card { background:white; padding:20px; border-radius:12px; max-width:420px;
          margin:auto; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align:center; }
  button,input { width:100%; padding:12px; font-size:18px; margin-top:10px; }
  .choice { padding:12px; border:1px solid #ccc; border-radius:8px; margin:8px 0;
            background:#fafafa; cursor:pointer; font-size:18px; }
  .choice:hover { background:#eaeaea; }
  .correct { background:#c8f7c5; }
  .wrong { background:#f7c5c5; }
  .timer { text-align:center; font-weight:bold; margin:10px 0; }
</style>
</head>
<body>

<div class="card">
  <h1>三角比テスト</h1>
  <p>範囲を選べ</p>
  <button onclick="selectMode(1)">0°〜180°</button>
  <button onclick="selectMode(2)">180°〜360°</button>
  <button onclick="selectMode(3)">両方（実戦）</button>

  <div class="timer" id="timer"></div>
  <div id="question"></div>
  <div id="choices"></div>
  <button onclick="nextQuestion()" id="nextBtn" style="display:none;">次の問題</button>
  <p id="result"></p>
</div>

<script>
const range1 = [
 ["π/6",30],["π/4",45],["π/3",60],["π/2",90],
 ["2π/3",120],["3π/4",135],["5π/6",150],["π",180]
];

const range2 = [
 ["7π/6",210],["5π/4",225],["4π/3",240],["3π/2",270],
 ["5π/3",300],["7π/4",315],["11π/6",330],["2π",360]
];

const values = {
 "sin30":"1/2","cos30":"√3/2","tan30":"1/√3",
 "sin45":"1/√2","cos45":"1/√2","tan45":"1",
 "sin60":"√3/2","cos60":"1/2","tan60":"√3",
 "sin90":"1","cos90":"0","tan90":"定義されない",
 "sin120":"√3/2","cos120":"-1/2","tan120":"-√3",
 "sin135":"1/√2","cos135":"-1/√2","tan135":"-1",
 "sin150":"1/2","cos150":"-√3/2","tan150":"-1/√3",
 "sin180":"0","cos180":"-1","tan180":"0",

 // ここから 180°〜360°
 "sin210":"-1/2","cos210":"-√3/2","tan210":"1/√3",
 "sin225":"-1/√2","cos225":"-1/√2","tan225":"1",
 "sin240":"-√3/2","cos240":"-1/2","tan240":"√3",
 "sin270":"-1","cos270":"0","tan270":"定義されない",
 "sin300":"-√3/2","cos300":"1/2","tan300":"-√3",
 "sin315":"-1/√2","cos315":"1/√2","tan315":"-1",
 "sin330":"-1/2","cos330":"√3/2","tan330":"-1/√3",
 "sin360":"0","cos360":"1","tan360":"0"
};

const funcs = ["sin","cos","tan"];
let list = [];
let score = 0, count = 0, TOTAL = 10;
let correctAnswer = "", startTime = 0, totalTime = 0;
let timerInt = null;

function selectMode(m){
 if(m===1) list=range1;
 if(m===2) list=range2;
 if(m===3) list=[...range1,...range2];
 document.querySelectorAll("button")[0].style.display="none";
 document.querySelectorAll("button")[1].style.display="none";
 document.querySelectorAll("button")[2].style.display="none";
 nextQuestion();
}

function startTimer(){
 startTime=Date.now();
 timerInt=setInterval(()=>{
  const t=(Date.now()-startTime)/1000;
  document.getElementById("timer").innerText=`時間：${t.toFixed(1)} 秒`;
 },100);
}

function stopTimer(){
 clearInterval(timerInt);
 const t=(Date.now()-startTime)/1000;
 totalTime+=t;
 return t;
}

function nextQuestion(){
 document.getElementById("nextBtn").style.display="none";
 document.getElementById("result").innerText="";
 if(count>=TOTAL){
   document.getElementById("question").innerHTML=`<h2>結果：${score}/${TOTAL}</h2>`;
   document.getElementById("choices").innerHTML="";
   document.getElementById("timer").innerText=`合計時間：${totalTime.toFixed(1)}秒`;
   return;
 }
 count++;
 const [rad,deg] = list[Math.floor(Math.random()*list.length)];
 const func = funcs[Math.floor(Math.random()*funcs.length)];
 correctAnswer = values[func+deg];

 let choices = Object.values(values).sort(()=>0.5-Math.random()).slice(0,3);
 if(!choices.includes(correctAnswer)) choices.push(correctAnswer);
 choices = choices.sort(()=>0.5-Math.random());

 document.getElementById("question").innerHTML=`<h2>第${count}問：${func}(${rad})</h2>`;
 const div=document.getElementById("choices");
 div.innerHTML="";
 choices.forEach(c=>{
  let d=document.createElement("div");
  d.className="choice";
  d.innerText=c;
  d.onclick=()=>checkAnswer(d,c);
  div.appendChild(d);
 });
 startTimer();
}

function checkAnswer(dom,ans){
 const t=stopTimer();
 [...document.querySelectorAll(".choice")].forEach(e=>e.onclick=null);
 if(ans===correctAnswer){
  dom.classList.add("correct"); score++;
  document.getElementById("result").innerText=`○ 正解！(${t.toFixed(1)}秒)`;
 } else {
  dom.classList.add("wrong");
  document.getElementById("result").innerText=
   `× 不正解（正：${correctAnswer}｜${t.toFixed(1)}秒）`;
 }
 document.getElementById("nextBtn").style.display="block";
}
</script>
</body>
</html>
