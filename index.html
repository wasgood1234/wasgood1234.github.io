<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角比テスト</title>
<style>
body { font-family: system-ui, -apple-system; padding: 20px; background: #f5f5f5; }
.card { background:white; padding:20px; max-width:420px; margin:auto; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.1);}
.choice{padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;background:#fafafa;font-size:18px;cursor:pointer;}
.choice:hover{background:#eaeaea;}
.correct{background:#c8f7c5;}
.wrong{background:#f7c5c5;}
button{width:100%;padding:12px;font-size:18px;margin-top:15px;}
</style>
</head>
<body>

<div class="card">
  <h1>三角比テスト</h1>
  <div id="menu">
    <button onclick="start('low')">0°〜180°</button>
    <button onclick="start('high')">180°〜360°</button>
    <button onclick="start('full50')">50問連続（0°〜360°）</button>
  </div>

  <div id="question" style="margin-top:20px"></div>
  <div id="choices"></div>
  <button id="nextBtn" style="display:none" onclick="nextQuestion()">次の問題</button>
  <p id="result"></p>
  <p id="timer"></p>
</div>

<script>
const funcs=["sin","cos","tan"];

const values={
  "sin30":"1/2","cos30":"√3/2","tan30":"1/√3",
  "sin45":"1/√2","cos45":"1/√2","tan45":"1",
  "sin60":"√3/2","cos60":"1/2","tan60":"√3",
  "sin90":"1","cos90":"0","tan90":"定義されない",
  "sin120":"√3/2","cos120":"-1/2","tan120":"-√3",
  "sin135":"1/√2","cos135":"-1/√2","tan135":"-1",
  "sin150":"1/2","cos150":"-√3/2","tan150":"-1/√3",
  "sin180":"0","cos180":"-1","tan180":"0",
  "sin210":"-1/2","cos210":"-√3/2","tan210":"1/√3",
  "sin225":"-1/√2","cos225":"-1/√2","tan225":"1",
  "sin240":"-√3/2","cos240":"-1/2","tan240":"√3",
  "sin270":"-1","cos270":"0","tan270":"定義されない",
  "sin300":"-√3/2","cos300":"1/2","tan300":"-√3",
  "sin315":"-1/√2","cos315":"1/√2","tan315":"-1",
  "sin330":"-1/2","cos330":"√3/2","tan330":"1/√3",
  "sin360":"0","cos360":"1","tan360":"0",
};

let mode="";
let score=0;
let count=0;
let totalQ=10;
let startTime;
let correct="";

function start(m){
  mode=m;
  score=0;
  count=0;
  document.getElementById("menu").style.display="none";
  document.getElementById("nextBtn").style.display="block";

  if(mode==="full50") totalQ=50;
  else totalQ=10;

  startTime = performance.now();
  nextQuestion();
}

function possibleAngles(){
  if(mode==="low") return [30,45,60,90,120,135,150,180];
  if(mode==="high") return [210,225,240,270,300,315,330,360];
  return [30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360];
}

function nextQuestion(){
  if(count>=totalQ){
    let time=(performance.now()-startTime)/1000;
    document.getElementById("question").innerHTML=`<h2>結果：${score}/${totalQ}</h2>`;
    document.getElementById("choices").innerHTML="";
    document.getElementById("result").innerText="";
    document.getElementById("timer").innerText=`所要時間：${time.toFixed(1)}秒`;
    document.getElementById("nextBtn").style.display="none";
    return;
  }

  count++;
  let a = possibleAngles();
  let deg = a[Math.floor(Math.random()*a.length)];
  let func=funcs[Math.floor(Math.random()*funcs.length)];
  correct = values[func+deg];

  document.getElementById("result").innerText="";
  document.getElementById("timer").innerText="";
  document.getElementById("question").innerHTML = `<h2>${count}問目：${func}(${deg}°)</h2>`;
  const div=document.getElementById("choices");
  div.innerHTML="";

  let choiceList = Object.values(values).sort(()=>0.5-Math.random()).slice(0,3);
  if(!choiceList.includes(correct)) choiceList.push(correct);
  choiceList.sort(()=>0.5-Math.random());

  choiceList.forEach(c=>{
    let el=document.createElement("div");
    el.className="choice";
    el.innerText=c;
    el.onclick=()=>check(el,c);
    div.appendChild(el);
  });
}

function check(el,ans){
  const all=document.querySelectorAll(".choice");
  all.forEach(c=>c.onclick=null);
  if(ans===correct){
    el.classList.add("correct");
    score++;
    document.getElementById("result").innerText="〇 正解！";
  }else{
    el.classList.add("wrong");
    document.getElementById("result").innerText=`✕ 正解：${correct}`;
  }
}
</script>
</body>
</html>
